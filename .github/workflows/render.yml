name: render
on:
  workflow_dispatch:
    inputs:
      plan: {description: "Path of plan json on the data branch, e.g. plans/batch1.json", required: true}
permissions: {contents: write}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: |
          git fetch origin data && git show "origin/data:${{ inputs.plan }}" > plan.json
          python scripts/render.py plan.json out
      - name: publish clips
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git config user.name clip-bot; git config user.email clip-bot@users.noreply.github.com
          git fetch origin media || true
          git checkout -B media origin/media 2>/dev/null || git checkout --orphan media
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p clips && cp out/*.mp4 out/*.jpg out/rendered.json clips/ && mv clips/rendered.json "clips/rendered-${{ github.run_id }}.json"
          git add clips && git commit -m "render ${{ github.run_id }}" && git push origin media
