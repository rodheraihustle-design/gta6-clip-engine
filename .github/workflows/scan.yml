name: scan
on:
  workflow_dispatch:
    inputs:
      target: {description: "Twitch channel name or VOD url", required: true}
      hours: {description: "How many recent hours to scan", default: "3"}
      top: {description: "Number of candidates", default: "8"}
permissions: {contents: write}
concurrency:
  group: scan-${{ github.event.inputs.target }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: python scripts/scan.py "${{ inputs.target }}" out --hours "${{ inputs.hours }}" --top "${{ inputs.top }}"
      - name: publish candidates
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          TAG="scan-${{ github.run_id }}"
          gh release create "$TAG" out/*.jpg out/candidates.json --title "$TAG" --notes "${{ inputs.target }}" --prerelease
          git config user.name clip-bot; git config user.email clip-bot@users.noreply.github.com
          git fetch origin data || true
          if git rev-parse -q --verify origin/data >/dev/null; then git worktree add ../pub origin/data; else git worktree add --detach ../pub && (cd ../pub && git checkout --orphan data && git rm -rfq .); fi
          cp -r out ../pub/out_tmp 2>/dev/null; cd ../pub
          mkdir -p scans && cp out_tmp/candidates.json "scans/$TAG.json"
          rm -rf out_tmp; git add scans && git commit -m "$TAG" && git push origin HEAD:data
