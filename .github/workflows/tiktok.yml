name: tiktok
on:
  workflow_dispatch:
    inputs:
      action: {description: "exchange or upload", required: true, default: upload}
      arg: {description: "auth code (exchange) or clip file name on the media branch, e.g. kreek_gooner_001.mp4 (upload)", required: true}
permissions: {contents: read}
jobs:
  tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - if: inputs.action == 'exchange'
        run: python scripts/tiktok.py exchange "${{ inputs.arg }}"
      - if: inputs.action == 'upload'
        run: |
          curl -sfL -o clip.mp4 "https://raw.githubusercontent.com/${{ github.repository }}/media/clips/${{ inputs.arg }}"
          python scripts/tiktok.py upload clip.mp4
