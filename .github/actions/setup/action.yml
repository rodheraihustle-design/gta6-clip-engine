name: setup
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: {python-version: "3.11"}
    - shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
        pip install -q yt-dlp faster-whisper
        curl -sL -o td.zip https://github.com/lay295/TwitchDownloader/releases/download/1.55.7/TwitchDownloaderCLI-1.55.7-Linux-x64.zip
        unzip -oq td.zip && chmod +x TwitchDownloaderCLI || echo "TwitchDownloader not available"
        mkdir -p fonts && curl -sL -o fonts/Montserrat.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"
