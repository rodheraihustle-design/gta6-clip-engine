name: setup
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: {python-version: "3.11", cache: pip}
    - uses: actions/cache@v4
      with: {path: ~/.cache/huggingface, key: hf-models-v1}
    - shell: bash
      env: {GH_TOKEN: "${{ github.token }}"}
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
        pip install -q -U -r requirements.txt
        gh release download -R lay295/TwitchDownloader --pattern '*CLI*Linux-x64.zip' -O td.zip
        unzip -oq td.zip && chmod +x TwitchDownloaderCLI
        mkdir -p fonts && curl -sfL -o fonts/Poppins-ExtraBold.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-ExtraBold.ttf"
